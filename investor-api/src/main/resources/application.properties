spring.application.name=investor-api

# ===========================
# DATASOURCE
# ===========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:magic}?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:investor_app}
spring.datasource.password=${DB_PASSWORD:unaPasswordSegura}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# SERVER
# ===========================
server.port=8080

# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect